<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="signUp.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>
<body>
    <div class="maindiv">
        <form action="">            
                <h1>Account Registration</h1>
                <label for="username">Username</label> <br>
                <input type="text" name="" id="" class="inputs" placeholder="Enter Your Full name here"> <br> <br>
                <label for="email">Email</label> <br>
                <input type="email" class="inputs"> <br> <br>
                <label for="password">Password</label> <br>
                <input type="password" name="" id="" class="inputs" placeholder="Must contain 6 characters"> <br><br>
                <label for="confPassword">Confirm password</label> <br>
                <input type="password" name="" id="" class="inputs">
                <br> <br>
                <button type="button" class="btn">Register</button>
                <br><br>
                <span>Have an account?
                    <a href="login.html">Sign-in</a>
                </span>
        </form>
    </div>
</body>
</html>
