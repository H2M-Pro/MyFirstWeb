<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="signUp.css">
     <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>
<body>
    <div class="maindiv">
        <form action="">            
                <h1>Account Registration</h1>
                <label for="username">Username</label> <br>
                <input type="text" name="" id="" class="inputs" placeholder="Enter Your Full name here"> <br> <br>
                <label for="email">Email</label> <br>
                <input type="email" class="inputs" placeholder="e.g johndeo@gmail.com"> <br> <br>
                <label for="password">Password</label> <br>
                <input type="password" name="" id="" class="inputs" placeholder="Must contain 6 characters"> <br><br>
                <label for="confPassword">Confirm password</label> <br>
                <input type="password" name="" id="" class="inputs" placeholder="Re-enter your password"> <br> <br>
                <br> <br>
                <button type="button" class="btn">Register</button>
                <br><br>
                <span>Have an account?
                <a href="login.html">Sign-in</a>
                </span>

                <a href="mainpage.html">
                <i class="fa-solid fa-house"></i><br>Home
                </a>
                </button> -->
        </form>
    </div>
</body>
</html>
